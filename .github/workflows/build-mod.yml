name: Build Forge mod

on:
  push:
    paths:
      - "minecraft-mod/**"
      - ".github/workflows/build-mod.yml"
  pull_request:
    paths:
      - "minecraft-mod/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-mod
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build --no-daemon
